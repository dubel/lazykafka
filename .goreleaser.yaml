# .goreleaser.yaml
version: 2

project_name: lazykafka

before:
  hooks:
    # You may need to run 'go mod tidy' or ensure deps are present
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Ensure the binary name matches the project name
    binary: lazykafka
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    # The name template for the release archive
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    # Use 'replacement' to make the OS/Arch names nicer in filenames
    builds_info:
      group: root
      owner: root

checksum:
  name_template: 'checksums.txt'



# Publish the GitHub Release in this repository
release:
  draft: false # Publish immediately to ensure tag-based URLs work
  prerelease: auto

# Publish the Homebrew Formula to the dubel/homebrew-tap repository
brews:
  - 
    # The repository to push the formula to
    repository:
      owner: dubel
      name: homebrew-tap

    # The project name and description for the formula
    name: lazykafka
    homepage: "https://github.com/dubel/lazykafka"
    description: "Relaxed Kafka TUI for browsing and managing clusters."
    
    # Packages needed by the formula at runtime/install time
    # dependencies:
    #   - name: git

    # Setup the install instruction
    install: |
      bin.install "lazykafka"
    
    # Test block for the formula
    test: |
      system "#{bin}/lazykafka", "--version"

# Generate Linux packages (deb, rpm)
nfpms:
  -
    maintainer: "lazykafka <https://github.com/dubel/lazykafka>"
    description: "Relaxed Kafka TUI for browsing and managing clusters."
    homepage: "https://github.com/dubel/lazykafka"
    license: "MIT"
    formats:
      - deb
      - rpm
      - archlinux
    
    # Packages to be installed/updated
    dependencies:
      - git


# Build and push the multi-arch Docker image to GHCR (requires buildx + registry login in CI)
dockers_v2:
  - images:
      - ghcr.io/dubel/lazykafka
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
