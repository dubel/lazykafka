name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write # Push the Docker image to GHCR with the workflow's GITHUB_TOKEN.
  contents: write # Needed for creating the release in THIS repo (if we were doing that), but vital for GoReleaser generally.

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # 'latest', 'nightly', or a specific version
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          # Needs a Personal Access Token (PAT) with `repo` scope to write to 
          # the external 'lazykafka' and 'homebrew-tap' repositories.
          # Add this as a secret in your PRIVATE repository settings.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_ACTIONS }}
