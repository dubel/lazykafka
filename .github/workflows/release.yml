name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write # Push the Docker image to GHCR with the workflow's GITHUB_TOKEN.
  contents: write # Create the GitHub Release in this repo.

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # 'latest', 'nightly', or a specific version
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          # Personal Access Token (PAT) with `repo` scope: the workflow's own
          # GITHUB_TOKEN cannot push the formula to the external 'homebrew-tap' repo.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_FOR_ACTIONS }}
